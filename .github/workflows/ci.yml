name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install checksum-pinned compiler
        run: bash scripts/install-compiler.sh
      - name: Read-only reproducibility gate
        run: |
          set -euo pipefail
          python3 scripts/builder.py --check
          git diff --exit-code
      - name: Behavioral, compilation and matching tests
        run: python3 -m unittest discover tests -v
