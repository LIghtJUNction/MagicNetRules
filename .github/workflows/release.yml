name: Build and Publish Rules
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'LIghtJUNction/MagicNetRules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash scripts/install-compiler.sh
      - name: Fetch, compile and verify a complete snapshot
        run: |
          set -euo pipefail
          test -z "$(git ls-files -- dist sources sources_binary release .cache)"
          python3 scripts/fetch_upstream.py
          python3 scripts/builder.py
          python3 scripts/builder.py --check
          python3 -m unittest discover tests -v
          python3 scripts/package_release.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish only changed, fully verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
