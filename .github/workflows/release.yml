name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          SING_BOX_VERSION="1.11.4"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box

      - name: Build rule-sets
        run: |
          python3 scripts/builder.py

      - name: Run tests
        run: |
          python3 -m unittest discover tests -v

      - name: Package release assets
        run: |
          tar -czvf magicnet-rules.tar.gz -C dist .
          zip -r magicnet-rules.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            magicnet-rules.tar.gz
            magicnet-rules.zip
            dist/manifest.json
