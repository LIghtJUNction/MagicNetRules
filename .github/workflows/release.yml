name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash scripts/install-compiler.sh
      - name: Reject stale checked-in release inputs
        run: |
          set -euo pipefail
          python3 scripts/builder.py --check
          python3 -m unittest discover tests -v
          git diff --exit-code
      - name: Package one runtime bundle
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -- *.srs manifest.json) | gzip -n -9 > release/magicnet-rules.tar.gz
          (cd release && sha256sum magicnet-rules.tar.gz > SHA256SUMS)
      - name: Publish immutable tag bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "MagicNetRules $TAG" --generate-notes release/magicnet-rules.tar.gz release/SHA256SUMS
