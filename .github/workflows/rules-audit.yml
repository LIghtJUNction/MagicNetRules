name: Rules audit
on:
  push:
    branches: [fix/reproducible-semantic-rules-20260916]
    paths: [.github/workflows/rules-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply exact locally tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/LIghtJUNction/MagicNetRules/git/blobs/c6ac4c1d44a77868fa420571f9f66dccefb6047a --jq .content | base64 -d | gzip -dc > "$RUNNER_TEMP/rules.patch"
          printf '%s  %s\n' 83f10f51001177890e3c1c9917c614df53cf6206ac0863dd07d3a7885d75ba33 "$RUNNER_TEMP/rules.patch" | sha256sum -c
          git apply --check "$RUNNER_TEMP/rules.patch"
          git apply "$RUNNER_TEMP/rules.patch"
          git diff --check
          bash scripts/install-compiler.sh
      - name: Compile, test and verify deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir audit
          python3 scripts/builder.py 2>&1 | tee audit/build.log
          python3 scripts/builder.py --check 2>&1 | tee audit/reproducibility.log
          python3 -m unittest discover tests -v 2>&1 | tee audit/tests.log
          cp dist/manifest.json audit/manifest.json
      - name: Publish validated rules source and outputs to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/builder.py scripts/install-compiler.sh tests/test_builder_contract.py tests/test_matching.py tests/test_parity.py README.md dist
          git diff --cached --check
          git commit -m 'fix: preserve rule semantics and verify reproducible builds without mutation'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/reproducible-semantic-rules-20260916
          git rev-parse HEAD > audit/commit.txt
          git ls-files -s scripts tests dist README.md > audit/source-tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: rules-validation
          path: audit/
          retention-days: 7
          if-no-files-found: error
