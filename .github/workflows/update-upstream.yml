name: Update Upstream Rulesets
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: rules-upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash scripts/install-compiler.sh
      - name: Fetch and validate complete candidate
        run: |
          set -euo pipefail
          python3 scripts/fetch_upstream.py
          python3 scripts/builder.py
          python3 scripts/builder.py --check
          python3 -m unittest discover tests -v
      - name: Propose reviewed update, never bypass main
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: automation/upstream-rules
          title: 'chore(rules): refresh verified upstream rule sets'
          commit-message: 'chore(rules): refresh verified upstream rule sets'
          body: 'Generated from upstream sources. Build, read-only reproducibility and matching tests ran in this workflow; review routing changes before merging.'
          add-paths: |
            sources/
            sources_binary/
            dist/
