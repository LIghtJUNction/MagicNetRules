name: Remove Generated Files from History
on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact reviewed main SHA; abort if main has moved'
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: rules-release
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'LIghtJUNction/MagicNetRules' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_main }}
          fetch-depth: 0
      - name: Rewrite all writable refs with atomic force-with-lease
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
        run: bash scripts/clean-history.sh
      - name: Build the first Release from rewritten main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
